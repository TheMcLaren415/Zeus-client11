<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Zeus Client — Моды</title>
  <script src="../assets/scripts/rv-launcher-common.js" defer></script>
  <style>
    @font-face { font-family:'Onest'; src:url('../assets/fonts/Onest-Regular.ttf') format('truetype'); font-weight:400; }
    @font-face { font-family:'Onest'; src:url('../assets/fonts/Onest-Medium.ttf')  format('truetype'); font-weight:500; }
    @font-face { font-family:'Onest'; src:url('../assets/fonts/Onest-SemiBold.ttf') format('truetype'); font-weight:600; }

    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
    ::-webkit-scrollbar { display:none; }
    html,body { width:1120px; height:650px; overflow:hidden; background:#141417; font-family:'Onest',sans-serif; user-select:none; }
    .main-content > *:not(.sidebar):not(.popup) { opacity:0; transition: opacity .22s ease; }
    body.ready .main-content > *:not(.sidebar):not(.popup) { opacity:1; }

    .app { width:1120px; height:650px; padding:20px 24px 24px 24px; display:flex; flex-direction:column; gap:18px;
           background:#141417; border:1px solid #1C1C20; box-shadow:0 34px 58.4px #141417; border-radius:8px; }

    .titlebar { display:flex; flex-direction:row; justify-content:space-between; align-items:center; width:100%; height:24px; flex-shrink:0; }
    .titlebar-left, .titlebar-right { display:flex; align-items:center; gap:24px; }
    .logo { display:flex; align-items:center; gap:8px; }
    .logo-icon { width:24px; height:12px; display:flex; align-items:center; flex-shrink:0; }
    .logo-icon img { width:100%; height:100%; object-fit:contain; display:block; }
    .logo-text { font-weight:500; font-size:12px; color:#FFF; }
    .logo-down { width:12px; height:12px; cursor:pointer; }
    .logo-down img { width:100%; height:100%; filter: brightness(0) invert(0.4); transition: filter .15s; }
    .logo-down:hover img { filter: brightness(0) invert(1); }

    .account-pill { display:flex; align-items:center; gap:8px; padding:4px 8px; height:24px; background:#18181C; border-radius:4px; cursor:pointer; }
    .avatar-sm { width:16px; height:16px; border-radius:2px; object-fit:cover; background:#333; flex-shrink:0; }
    .pill-info { display:flex; align-items:center; gap:4px; }
    .pill-username { font-weight:500; font-size:13px; color:#D8D8D8; }
    .pill-dot { width:6px; height:6px; background:#14CF7E; border-radius:50%; flex-shrink:0; }
    .pill-down { width:12px; height:12px; display:flex; align-items:center; cursor:pointer; }
    .pill-down img { width:100%; height:100%; filter: brightness(0) invert(0.4); }

    .window-controls { display:flex; align-items:center; gap:8px; }
    .btn-wc { width:24px; height:24px; display:flex; align-items:center; justify-content:center; border:none; background:none; padding:0; cursor:pointer; }
    .btn-wc img { width:100%; height:100%; display:block; filter: brightness(0) invert(0.4); transition: filter .15s; }
    .btn-wc:hover img { filter: brightness(0) invert(1); }

    .main-content { display:flex; flex-direction:row; gap:12px; flex:1; min-height:0; position:relative; }
    .sidebar { width:56px; flex-shrink:0; display:flex; flex-direction:column; justify-content:space-between; overflow:visible; margin-left:-12px; }
    .nav-top { display:flex; flex-direction:column; gap:4px; }
    .nav-btn { position:relative; width:56px; height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center;
               border-radius:12px; border:none; background:none; padding:12px 16px; cursor:pointer; overflow:hidden; transition: padding .18s ease; }
    .nav-btn.active { background:#18181C; cursor:default; }
    .nav-btn img { width:24px; height:24px; display:block; flex-shrink:0; filter: brightness(0) invert(0.4); transition: transform .18s ease, filter .18s ease; position:relative; z-index:1; }
    .nav-btn.active img { filter: brightness(0) saturate(100%) invert(23%) sepia(92%) saturate(1658%) hue-rotate(215deg) brightness(88%) contrast(97%); }
    .nav-label { position:absolute; bottom:8px; left:50%; transform: translateX(-50%) translateY(120%); opacity:0;
                 font-weight:500; font-size:11px; color:#656571; white-space:nowrap; transition: opacity .18s ease, transform .18s ease;
                 pointer-events:none; z-index:0; }
    .nav-btn:not(.active):hover { padding:8px 16px; }
    .nav-btn:not(.active):hover img { transform: translateY(-6px); filter: brightness(0) invert(1); }
    .nav-btn:not(.active):hover .nav-label { opacity:1; transform: translateX(-50%) translateY(0); }

    /* ── Mods page layout ── */
    .mods-page { flex:1; min-width:0; display:flex; flex-direction:column; gap:14px; overflow:hidden; }

    .mods-header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-shrink:0; }
    .mods-header-left { display:flex; align-items:baseline; gap:12px; min-width:0; }
    .mods-title { font-weight:600; font-size:24px; line-height:1; color:#FFF; }
    .mods-title-sub { font-weight:500; font-size:13px; color:#656571; }

    .header-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }
    .version-pills { display:flex; gap:6px; flex-shrink:0; }
    .v-pill {
      padding: 8px 14px; height: 36px;
      background:#18181C; border:1px solid #1C1C20; border-radius:8px;
      cursor:pointer; font-family:'Onest',sans-serif; font-weight:500; font-size:13px; color:#9999A0;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
      display:flex; align-items:center; gap:8px;
    }
    .v-pill:hover { color:#FFF; }
    .v-pill.active { background:#1F1F24; color:#FFF; border-color:#1C1C20; }

    .tabs { display:flex; gap:6px; flex-shrink:0; }
    .tab {
      padding:8px 16px; height:34px; background:transparent; border:1px solid transparent; border-radius:8px;
      cursor:pointer; font-family:'Onest',sans-serif; font-weight:500; font-size:12px; color:#9999A0; transition: all .15s;
    }
    .tab:hover { color:#FFF; }
    .tab.active { background:#18181C; border-color:#1C1C20; color:#FFF; }
    .tab .count { margin-left:6px; font-size:11px; color:#14CF7E; }

    .search-row { display:flex; gap:10px; flex-shrink:0; align-items:center; }
    .search-box {
      flex:1; height:40px; display:flex; align-items:center; gap:10px; padding:0 14px;
      background:#18181C; border:1px solid #1C1C20; border-radius:8px;
    }
    .search-box:focus-within { border-color:#2A2A30; }
    .search-box img { width:16px; height:16px; display:block; opacity:.6; }
    .search-box input {
      flex:1; background:none; border:none; outline:none; color:#FFF; font-family:'Onest',sans-serif;
      font-weight:500; font-size:13px;
    }
    .search-box input::placeholder { color:#656571; }
    .search-btn {
      padding:0 20px; height:40px; background:#18181C; border:1px solid #1C1C20; border-radius:8px;
      cursor:pointer; font-family:'Onest',sans-serif; font-weight:500; font-size:12px; color:#FFF;
      transition: background .15s ease, box-shadow .15s ease;
    }
    .search-btn:hover { background:#2563EB; border-color:transparent; box-shadow:0 5px 16px rgba(37,99,235,0.34); }

    .mod-scroll { flex:1; min-height:0; overflow-y:auto; padding-right:4px; display:flex; flex-direction:column; gap:10px; }

    .mod-card {
      display:flex; gap:16px; padding:18px 20px;
      background:#151517; border:1px solid #1C1C20; border-radius:12px;
      align-items:center; min-height:88px;
      transition: border-color .15s ease;
    }
    .mod-card:hover { border-color:#2A2A30; }

    .mod-icon {
      width:56px; height:56px; flex-shrink:0;
      border-radius:10px; background:#1F1F24;
      display:flex; align-items:center; justify-content:center; overflow:hidden;
    }
    .mod-icon img { max-width:100%; max-height:100%; object-fit:contain; }
    .mod-icon.fallback {
      background: linear-gradient(135deg, #2A2A30 0%, #18181C 100%);
      color:#2563EB; font-weight:600; font-size:24px;
    }

    .mod-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
    .mod-name-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .mod-name { font-weight:600; font-size:15px; color:#FFF; }

    .mod-badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:4px; font-weight:500; font-size:11px; }
    .mod-badge.installed { background: rgba(20,207,126,0.18); color:#14CF7E; }
    .mod-badge.dep        { background: rgba(255,191,0,0.18); color:#FFBF00; }

    .mod-desc { font-weight:500; font-size:12px; line-height:16px; color:#9999A0;
                display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .mod-meta { font-weight:500; font-size:11px; color:#656571; }

    .mod-actions { display:flex; gap:8px; flex-shrink:0; align-items:center; }
    .btn {
      display:flex; justify-content:center; align-items:center; gap:8px;
      padding:10px 18px; min-width:128px; height:40px;
      background:#18181C; border:1px solid #1C1C20; border-radius:8px;
      cursor:pointer; font-family:'Onest',sans-serif;
      font-weight:500; font-size:12px; color:#FFF;
      flex-shrink:0;
      transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .btn:hover { background:#2563EB; border-color: transparent; box-shadow: 0 5px 16px rgba(37,99,235,0.34); }
    .btn.ghost { background:transparent; }
    .btn.ghost:hover { background:#2A2A30; box-shadow:none; }
    .btn.installed-state { background: transparent; cursor:default; color:#14CF7E; border-color:#1C1C20; }
    .btn.installed-state:hover { background: transparent; box-shadow: none; border-color:#1C1C20; }
    .btn:disabled { opacity:.55; cursor:default; }
    .btn.danger:hover { background:#FF6363; box-shadow:0 5px 16px rgba(255,99,99,0.3); }

    .spinner { width:14px; height:14px; border:2px solid currentColor; border-top-color: transparent;
      border-radius:50%; display:inline-block; animation: spin .8s linear infinite; }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

    .empty-state {
      padding: 60px 24px; text-align:center;
      color:#656571; font-weight:500; font-size:13px;
      background:#151517; border:1px solid #1C1C20; border-radius:12px;
    }
    .empty-state-icon { width:48px; height:48px; margin: 0 auto 16px; border-radius:12px; background:#1F1F24;
      display:flex; align-items:center; justify-content:center; font-size: 24px; }
    .empty-state-title { color:#D8D8D8; font-size:14px; margin-bottom:4px; }

    .toast { position:absolute; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px); opacity:0;
             background:#151517; border:1px solid #2A2A30; border-radius:8px; padding:12px 18px;
             font-weight:500; font-size:12px; color:#D8D8D8; z-index:300; transition: all .25s ease; pointer-events:none;
             max-width:600px; text-align:center; }
    .toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.error { border-color:#FF6363; color:#FF6363; }
    .toast.success { border-color:#14CF7E; color:#14CF7E; }
  </style>
</head>
<body>
  <div class="app" id="app">

    <!-- Titlebar -->
    <div class="titlebar">
      <div class="titlebar-left">
        <div class="logo">
          <div class="logo-icon"><img src="../assets/icons/logo.svg" alt=""></div>
          <span class="logo-text">Zeus Client</span>
          <div class="logo-down"><img src="../assets/icons/down.svg" alt=""></div>
        </div>
      </div>
      <div class="titlebar-right">
        <div style="display:flex;align-items:center;gap:12px;">

        </div>
        <div class="window-controls">
          <button class="btn-wc" id="btn-hide"><img src="../assets/icons/hide.svg" alt=""></button>
          <button class="btn-wc" id="btn-close"><img src="../assets/icons/close.svg" alt=""></button>
        </div>
      </div>
    </div>

    <!-- Main -->
    <div class="main-content">

      <!-- Sidebar -->
      <div class="sidebar">
        <div class="nav-top">
          <button class="nav-btn" onclick="navigateTo('dashboard.html')">
            <img src="../assets/icons/home.svg" alt=""><span class="nav-label">Главная</span>
          </button>
          <button class="nav-btn" onclick="navigateTo('versions.html')">
            <img src="../assets/icons/puzzle.svg" alt=""><span class="nav-label">Версии</span>
          </button>
          <button class="nav-btn active">
            <img src="../assets/icons/import.svg" alt=""><span class="nav-label">Моды</span>
          </button>
          <button class="nav-btn" onclick="navigateTo('accounts.html')">
            <img src="../assets/icons/account-manager.svg" alt=""><span class="nav-label">Аккаунты</span>
          </button>
          <button class="nav-btn" onclick="navigateTo('settings.html')">
            <img src="../assets/icons/settings.svg" alt=""><span class="nav-label">Настройки</span>
          </button>
        </div>
      </div>

      <!-- Mods page -->
      <div class="mods-page">
        <div class="mods-header">
          <div class="mods-header-left">
            <span class="mods-title">Моды</span>
            <span class="mods-title-sub">Modrinth</span>
          </div>
          <div class="header-right">
            <div class="tabs">
              <button class="tab active" id="tab-catalog" data-tab="catalog">Каталог</button>
              <button class="tab" id="tab-installed" data-tab="installed">Установленные<span class="count" id="installed-count">0</span></button>
            </div>
            <div class="version-pills" id="version-pills"></div>
          </div>
        </div>

        <div class="search-row" id="search-row">
          <div class="search-box">
            <img src="../assets/icons/import.svg" alt="">
            <input id="search-input" type="text" placeholder="Поиск модов на Modrinth…" autocomplete="off">
          </div>
          <button class="search-btn" id="search-btn">Искать</button>
        </div>

        <div class="mod-scroll" id="mod-scroll">
          <div class="empty-state">
            <div class="empty-state-icon">⏳</div>
            <div class="empty-state-title">Загрузка</div>
            <div>Открываем каталог модов…</div>
          </div>
        </div>
      </div>

    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    function navigateTo(url) { window.location.href = url; }
    document.getElementById('btn-hide').addEventListener('click', () => { window.nativeHide?.().catch(() => {}); });
    document.getElementById('btn-close').addEventListener('click', () => { window.nativeClose?.().catch(() => {}); });
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.body.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (e.clientY > 44) return;
      if (e.target.closest('#btn-hide,#btn-close,.logo-down,.popup')) return;
      window.nativeDragMove?.().catch(() => {});
    });

    function applyUserToPill(u) {
      if (!u) return;
      const nameEl   = document.querySelector('#account-pill .pill-username');
      const avatarEl = document.querySelector('#account-pill .avatar-sm');
      if (nameEl && u.username) nameEl.textContent = u.username;
      const src = u.avatarDataUrl || u.avatarUrl;
      if (avatarEl && src) avatarEl.src = src;
    }
    try { const cached = JSON.parse(localStorage.getItem('rv_user') || 'null'); if (cached) applyUserToPill(cached); } catch (_) {}

    // ── State ──
    const VERSION_DEFS = [ { mc: '1.21.4', label: '1.21.4' } ];
    let currentVersion = '1.21.4';
    let currentTab = 'catalog';
    let installedMods = [];          // [{name, filename, size}]
    let query = '';

    // ── Toast ──
    let toastTimer = null;
    function showToast(msg, type) {
      const el = document.getElementById('toast');
      el.className = 'toast visible' + (type ? ' ' + type : '');
      el.textContent = msg;
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('visible'), 3500);
    }

    // ── Helpers ──
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function fmtSize(bytes) {
      if (!bytes || bytes < 0) return '';
      if (bytes < 1024) return bytes + ' Б';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
      return (bytes / 1024 / 1024).toFixed(1) + ' МБ';
    }
    function fmtDownloads(n) {
      if (!n) return '';
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return String(n);
    }

    async function nativeCall(fn) {
      try { return await fn(); } catch (err) { return { ok:false, error: (err && err.message) || 'ошибка' }; }
    }

    // ── Installed mods ──
    async function loadInstalled() {
      const r = await nativeCall(() => window.nativeListMods?.(currentVersion));
      const data = (typeof r === 'string') ? JSON.parse(r) : r;
      installedMods = (data && data.ok && Array.isArray(data.mods)) ? data.mods : [];
      document.getElementById('installed-count').textContent = installedMods.length;
    }

    function isInstalledByName(name) {
      return installedMods.some(m => {
        const mn = (m.name || '').toLowerCase();
        return mn.length > 0 && (name || '').toLowerCase().includes(mn);
      });
    }

    // ── Render catalog ──
    const iconFallback = (mod) => {
      const initial = (mod.name || mod.slug || '?').substring(0,1).toUpperCase();
      return `<div class="mod-icon fallback">${escapeHtml(initial)}</div>`;
    };

    function catalogCard(mod) {
      // Modrinth icons are WebP served from external CDNs; a known WebView2
      // crash happens while decoding those (EmbeddedBrowserWebView fault at a
      // fixed offset). Render a letter tile instead so the catalog never
      // touches WebP decoding.
      const icon = iconFallback(mod);
      const installed = isInstalledByName(mod.name);
      const badge = installed ? `<span class="mod-badge installed">✓ Установлено</span>` : '';
      const action = installed
        ? `<button class="btn installed-state" disabled>Установлено</button>`
        : `<button class="btn" data-action="download" data-id="${escapeHtml(mod.id)}">Скачать</button>`;
      return `
        <div class="mod-card" data-id="${escapeHtml(mod.id)}">
          ${icon}
          <div class="mod-info">
            <div class="mod-name-row">
              <span class="mod-name">${escapeHtml(mod.name || mod.slug || mod.id)}</span>
              ${badge}
            </div>
            <div class="mod-desc">${escapeHtml(mod.description || '')}</div>
            <div class="mod-meta">⬇ ${fmtDownloads(mod.downloads)} • ${escapeHtml(mod.projectType || 'mod')}</div>
          </div>
          <div class="mod-actions">${action}</div>
        </div>`;
    }

    function installedCard(m) {
      return `
        <div class="mod-card">
          <div class="mod-icon fallback">${escapeHtml((m.name || '?').substring(0,1).toUpperCase())}</div>
          <div class="mod-info">
            <div class="mod-name-row">
              <span class="mod-name">${escapeHtml(m.name || m.filename)}</span>
              <span class="mod-badge installed">✓ Установлено</span>
            </div>
            <div class="mod-meta">${escapeHtml(m.filename || '')} ${m.size ? '• ' + fmtSize(m.size) : ''}</div>
          </div>
          <div class="mod-actions">
            <button class="btn ghost danger" data-action="delete" data-filename="${escapeHtml(m.filename)}">Удалить</button>
          </div>
        </div>`;
    }

    function emptyState(icon, title, sub) {
      return `<div class="empty-state">
        <div class="empty-state-icon">${icon}</div>
        <div class="empty-state-title">${escapeHtml(title)}</div>
        <div>${escapeHtml(sub || '')}</div>
      </div>`;
    }

    async function renderCatalog() {
      const scroll = document.getElementById('mod-scroll');
      if (!query) {
        scroll.innerHTML = emptyState('🔍', 'Каталог модов Modrinth', 'Введите запрос в поиске, чтобы найти моды и установить их в один клик.');
        return;
      }
      scroll.innerHTML = emptyState('⏳', 'Загрузка', 'Ищем моды на Modrinth…');
      const r = await nativeCall(() => window.nativeSearchMods?.(query, currentVersion, 30));
      const data = (typeof r === 'string') ? JSON.parse(r) : r;
      if (!data || !data.ok) {
        scroll.innerHTML = emptyState('⚠️', 'Ошибка поиска', (data && data.error) || 'Проверьте соединение с интернетом');
        return;
      }
      const mods = data.mods || [];
      if (mods.length === 0) {
        scroll.innerHTML = emptyState('📦', 'Ничего не найдено', 'Попробуйте изменить запрос.');
        return;
      }
      scroll.innerHTML = mods.map(catalogCard).join('');
      bindActions();
    }

    async function renderInstalled() {
      const scroll = document.getElementById('mod-scroll');
      await loadInstalled();
      if (installedMods.length === 0) {
        scroll.innerHTML = emptyState('📦', 'Пока нет установленных модов', 'Используйте вкладку «Каталог», чтобы найти и скачать моды.');
        return;
      }
      scroll.innerHTML = installedMods.map(installedCard).join('');
      bindActions();
    }

    function bindActions() {
      document.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', onAction);
      });
    }

    async function onAction(e) {
      const btn = e.currentTarget;
      const action = btn.dataset.action;
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span>${action === 'delete' ? 'Удаление…' : 'Скачивание…'}`;
      try {
        if (action === 'download') {
          const r = await nativeCall(() => window.nativeDownloadMod?.(btn.dataset.id, currentVersion));
          const j = (typeof r === 'string') ? JSON.parse(r) : r;
          if (!j || !j.ok) {
            showToast('Не удалось скачать: ' + (j && j.error ? j.error : 'неизвестная ошибка'), 'error');
          } else {
            const extra = j.downloaded ? ` • также установлено: ${j.downloaded}` : '';
            showToast('✓ Мод установлен' + extra, 'success');
          }
        } else if (action === 'delete') {
          const r = await nativeCall(() => window.nativeDeleteMod?.(btn.dataset.filename, currentVersion));
          const j = (typeof r === 'string') ? JSON.parse(r) : r;
          if (!j || !j.ok) showToast('Не удалось удалить: ' + (j && j.error ? j.error : 'ошибка'), 'error');
          else showToast('✓ Мод удалён', 'success');
        }
      } catch (err) {
        showToast('Ошибка: ' + ((err && err.message) || err), 'error');
      }
      // Refresh
      if (currentTab === 'catalog') { await loadInstalled(); await renderCatalog(); }
      else { await renderInstalled(); }
    }

    // ── Tabs ──
    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.getElementById('search-row').style.display = (tab === 'catalog') ? '' : 'none';
      if (tab === 'catalog') renderCatalog();
      else renderInstalled();
    }

    // ── Version pills ──
    function renderVersionPills() {
      document.getElementById('version-pills').innerHTML = VERSION_DEFS.map(v => `
        <button class="v-pill ${v.mc === currentVersion ? 'active' : ''}" data-mc="${v.mc}">${v.label}</button>
      `).join('');
      document.querySelectorAll('#version-pills .v-pill').forEach(p => {
        p.addEventListener('click', () => {
          currentVersion = p.dataset.mc;
          renderVersionPills();
          if (currentTab === 'catalog') renderCatalog();
          else renderInstalled();
        });
      });
    }

    // ── Search ──
    function doSearch() {
      query = document.getElementById('search-input').value.trim();
      if (!query) { renderCatalog(); return; }
      setTab('catalog');
      renderCatalog();
    }

    // ── Init ──
    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => {
        document.body.classList.add('ready');
        window.nativeReady?.().catch(() => {});
      });
      (async () => {
        try {
          const s = await window.nativeAuthState?.();
          if (s?.user) {
            try { localStorage.setItem('rv_user', JSON.stringify(s.user)); } catch (_) {}
            applyUserToPill(s.user);
          }
        } catch (_) {}
      })();

      renderVersionPills();
      setTab('catalog');
      loadInstalled();

      document.getElementById('search-btn').addEventListener('click', doSearch);
      document.getElementById('search-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
      document.getElementById('tab-catalog').addEventListener('click', () => setTab('catalog'));
      document.getElementById('tab-installed').addEventListener('click', () => setTab('installed'));
    });
  </script>
</body>
</html>
